# nim.cfg — PSP cross-compilation settings

# Кросс-компилятор для MIPS (PSP = MIPS I little-endian)
mipsel.standalone.gcc.exe = "psp-gcc"
mipsel.standalone.gcc.linkerexe = "psp-gcc"

# Флаги компиляции
gcc.options.always = "-I/usr/local/pspdev/psp/include -I/usr/local/pspdev/psp/sdk/include -DPSP -D__PSP__ -D_PSP_FW_VERSION=600 -G0 -O2 -DNDEBUG -fomit-frame-pointer -ffunction-sections -fdata-sections -fno-asynchronous-unwind-tables -fno-math-errno"

# Флаги линковки
gcc.options.linker = "-L/usr/local/pspdev/psp/lib -L/usr/local/pspdev/psp/sdk/lib -specs=/usr/local/pspdev/psp/sdk/lib/prxspecs -Wl,-T,/usr/local/pspdev/psp/sdk/lib/linkfile.prx -Wl,-q -Wl,--gc-sections -s -Wl,--build-id=none"
