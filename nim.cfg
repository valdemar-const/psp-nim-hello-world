# nim.cfg
# Nim compiler settings for PSP cross-compilation.
# Only Nim-specific settings belong here; toolchain/linker flags live in
# xmake/toolchains/pspdev.lua so there is a single source of truth.

# Cross-compiler: PSP = MIPS I little-endian
mipsel.standalone.gcc.exe       = "psp-gcc"
mipsel.standalone.gcc.linkerexe = "psp-gcc"
